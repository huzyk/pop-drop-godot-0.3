name: Build Android beta APK
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-beta.yml
      - export_presets.cfg
      - project.godot
      - 'scenes/**'
      - 'scripts/**'
      - 'assets/**'

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted ubuntu-latest already provides the Android SDK/SDK Manager.
      # setup-android@v3 calls the obsolete 'sdkmanager tools' package and fails.
      - name: Install API 36 and Godot Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Create disposable debug signing key (never committed)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/popdrop-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/popdrop-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Configure headless editor and import assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.config/godot"
          # Godot editor CLI does not expose Android SDK flags. This user-local
          # EditorSettings file is generated on each runner and not committed.
          cat > "${HOME}/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          timeout 120s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/android-import.log
      - name: Export installable arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          timeout 180s godot --headless --editor --path . --export-debug "Android Debug Beta" build/pop-drop-debug.apk 2>&1 | tee /tmp/android-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:.*Export' /tmp/android-export.log; then
            echo "Godot reported an Android export failure" >&2
            exit 1
          fi
          test -s build/pop-drop-debug.apk
          unzip -t build/pop-drop-debug.apk | tail -n 2
          ls -lh build/pop-drop-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pop-drop-android-arm64-beta-debug
          path: build/pop-drop-debug.apk
          retention-days: 14
          if-no-files-found: error
