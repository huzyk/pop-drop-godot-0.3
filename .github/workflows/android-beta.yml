name: Build Android beta APK (unsigned Play release)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-beta.yml
      - export_presets.cfg
      - tests/configure_android.gd

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub-hosted ubuntu-latest already provides the Android SDK/SDK Manager.
      # setup-android@v3 calls the obsolete 'sdkmanager tools' package and fails.
      - name: Install API 36 and Godot Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'cmdline-tools;latest' 'ndk;28.1.13356709'
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Create disposable debug signing key (never committed)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/popdrop-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/popdrop-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import resources and configure Android export
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --import --quit
          godot --headless --editor --path . --script res://tests/configure_android.gd
      - name: Export installable arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --editor --path . --export-debug "Android Debug Beta" build/pop-drop-debug.apk 2>&1 | tee /tmp/android-export.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|ERROR:.*Export' /tmp/android-export.log; then
            echo "Godot reported an Android export failure" >&2
            exit 1
          fi
          test -s build/pop-drop-debug.apk
          unzip -t build/pop-drop-debug.apk | tail -n 2
          ls -lh build/pop-drop-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pop-drop-android-arm64-beta-debug
          path: build/pop-drop-debug.apk
          retention-days: 14
          if-no-files-found: error
