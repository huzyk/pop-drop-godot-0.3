name: Godot gameplay checks

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import assets and scripts
        run: godot --headless --editor --path . --import --quit
      - name: Test core Gravity rules
        run: godot --headless --path . --script res://tests/test_gravity_rules.gd
      - name: Test checkpoints and parsing
        run: godot --headless --path . --script res://tests/test_gravity_session.gd
      - name: Test ad reward contract
        run: godot --headless --path . --script res://tests/test_gravity_ads.gd
      - name: Test daily missions and cosmetics
        run: godot --headless --path . --script res://tests/test_gravity_progression.gd
      - name: Test pressure waves and unbreakable rock physics
        run: timeout 40s godot --headless --path . --script res://tests/test_gravity_pressure.gd
      - name: Test coin economy and bomb
        run: timeout 40s godot --headless --path . --script res://tests/test_gravity_shop.gd
      - name: Test mobile arcade layout and touch zones
        run: timeout 40s godot --headless --path . --script res://tests/test_gravity_layout.gd
      - name: Test audio and haptics
        run: timeout 40s godot --headless --path . --script res://tests/test_gravity_feedback.gd
      - name: Smoke test actual main scene (including audio)
        run: timeout 40s godot --headless --path . --quit-after 10
